name: Update X IDs

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      cookie:
        description: "X (Twitter) Cookie (auth_token, ct0, twid 等)"
        required: false
        type: string
      authorization:
        description: "X Authorization (Bearer AAAAA...)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-x-ids
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: test

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Install xvfb (Virtual Framebuffer for Desktop Headed Mode)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Setup Cloudflare WARP (Bypass Cloudflare Datacenter IP 403)
        continue-on-error: true
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp
          sudo systemctl start warp-svc || sudo warp-svc &
          sleep 2
          warp-cli --accept-tos registration new || warp-cli registration new || true
          warp-cli --accept-tos mode proxy || warp-cli mode proxy || true
          warp-cli --accept-tos proxy port 40000 || warp-cli proxy port 40000 || true
          warp-cli --accept-tos connect || warp-cli connect || true
          sleep 4
          if curl -s --socks5 127.0.0.1:40000 https://cloudflare.com/cdn-cgi/trace | grep -q "warp=on"; then
            echo "🎉 WARP 连接成功！"
            echo "WARP_PROXY=socks5://127.0.0.1:40000" >> $GITHUB_ENV
          else
            echo "⚠️ WARP 未就绪，将使用直连 + 真实桌面伪装环境"
          fi

      - name: Update X query IDs
        run: xvfb-run --auto-servernum pnpm update-x-ids
        env:
          ALL_PROXY: ${{ env.WARP_PROXY }}
          HTTPS_PROXY: ${{ env.WARP_PROXY }}
          HTTP_PROXY: ${{ env.WARP_PROXY }}
          X_COOKIE: ${{ github.event.inputs.cookie || secrets.X_COOKIE }}
          X_AUTHORIZATION: ${{ github.event.inputs.authorization || secrets.X_AUTHORIZATION }}

      - name: Detect changes
        id: detect_changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "变更文件列表:"
            git diff --name-only
          fi

      - name: Create or update PR from test to main
        if: steps.detect_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          # 如果仓库设置未开启 "Allow GitHub Actions to create and approve pull requests"，
          # 即使配置了 pull-requests: write，GITHUB_TOKEN 也不能创建 PR。
          # 可添加 UPDATE_X_IDS_PR_TOKEN：fine-grained PAT，权限为 contents:write 和 pull_requests:write。
          token: ${{ secrets.UPDATE_X_IDS_PR_TOKEN || github.token }}
          branch: test
          base: main
          commit-message: "chore: update x ids"
          title: "chore: update x ids"
          body: |
            自动更新 X query IDs。

            - 来源：`Update X IDs` workflow
            - 目标文件：`src/api/x.ts`
          delete-branch: false
